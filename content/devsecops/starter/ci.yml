name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject manual runs outside main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install workshop Python baseline
        run: |
          cat > "$RUNNER_TEMP/workshop-constraints.txt" <<'CONSTRAINTS'
          blinker==1.9.0
          click==8.5.0
          Flask==3.1.3
          Flask-SQLAlchemy==3.1.1
          greenlet==3.5.6
          itsdangerous==2.2.0
          Jinja2==3.1.6
          MarkupSafe==3.0.3
          SQLAlchemy==2.0.54
          typing_extensions==4.16.0
          Werkzeug==3.1.8
          CONSTRAINTS
          python -m pip install -r app/server/requirements.txt -c "$RUNNER_TEMP/workshop-constraints.txt"
          python -m pip check
      - name: Run API tests
        working-directory: app/server
        env:
          DATABASE_PATH: ':memory:'
        run: python -m unittest test_app -v

  client-build:
    name: client-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject manual runs outside main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install and build client
        working-directory: app/client
        run: |
          npm ci
          npm run build
